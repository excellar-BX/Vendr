<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="vendr-logo.png" />

  <title>Reset Password — Vendr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F0A06;
      color: #FDF6EC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1A1208;
      border: 1px solid #2A1F10;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 28px; font-weight: 800; color: #E8521A; margin-bottom: 24px; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #A08060; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .input-wrap { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; color: #A08060; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #0F0A06;
      border: 1px solid #2A1F10;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      color: #FDF6EC;
      outline: none;
    }
    input:focus { border-color: #E8521A; }
    .btn {
      display: block;
      background: #E8521A;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:disabled { background: #4A3020; color: #6B5E50; cursor: not-allowed; }
    .error-msg { color: #E85252; font-size: 13px; margin-bottom: 12px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Vendr</div>

    <!-- Form state -->
    <div id="state-form">
      <div class="icon">🔐</div>
      <h1>New Password</h1>
      <p>Enter a new password for your Vendr account.</p>
      <div id="form-error" class="error-msg hidden"></div>
      <div class="input-wrap">
        <label>New Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" />
      </div>
      <div class="input-wrap">
        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="Repeat password" />
      </div>
      <button class="btn" id="submit-btn" onclick="submitReset()">Reset Password</button>
    </div>

    <!-- Success state -->
    <div id="state-success" class="hidden">
      <div class="icon">✅</div>
      <h1>Password Reset!</h1>
      <p>Your password has been updated. Log in to Vendr with your new password.</p>
      <a href="vendr://login" class="btn">Open Vendr App</a>
    </div>

    <!-- Error state -->
    <div id="state-error" class="hidden">
      <div class="icon">❌</div>
      <h1>Link Expired</h1>
      <p id="error-message">This reset link is invalid or has expired. Request a new one from the app.</p>
      <a href="vendr://forgot-password" class="btn">Back to App</a>
    </div>
  </div>

  <script>
    const API = 'https://vendr-production.up.railway.app/api'
    const token = new URLSearchParams(window.location.search).get('token')

    function show(id) {
      ['state-form','state-success','state-error'].forEach(s =>
        document.getElementById(s).classList.add('hidden'))
      document.getElementById(id).classList.remove('hidden')
    }

    // If no token in URL, show error immediately
    if (!token) {
      document.getElementById('error-message').textContent = 'No reset token found in this link.'
      show('state-error')
    }

    async function submitReset() {
      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm').value
      const errorEl = document.getElementById('form-error')
      const btn = document.getElementById('submit-btn')

      errorEl.classList.add('hidden')

      if (password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.'
        return errorEl.classList.remove('hidden')
      }
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.'
        return errorEl.classList.remove('hidden')
      }

      btn.disabled = true
      btn.textContent = 'Resetting...'

      try {
        const res = await fetch(`${API}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: password }),
        })
        if (res.ok) return show('state-success')
        const data = await res.json()
        document.getElementById('error-message').textContent = data.message || 'Reset failed.'
        show('state-error')
      } catch {
        document.getElementById('error-message').textContent = 'Network error. Please try again.'
        show('state-error')
      }
    }
  </script>
</body>
</html>
