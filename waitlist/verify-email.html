<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="vendr-logo.png" />

  <title>Verify Email — Vendr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F0A06;
      color: #FDF6EC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1A1208;
      border: 1px solid #2A1F10;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 28px; font-weight: 800; color: #E8521A; margin-bottom: 24px; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #A08060; font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
    .btn {
      display: block;
      background: #E8521A;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Vendr</div>
    <div id="state-loading">
      <div class="icon">⏳</div>
      <h1>Verifying your email...</h1>
      <p>Please wait a moment.</p>
    </div>
    <div id="state-success" class="hidden">
      <div class="icon">✅</div>
      <h1>Email Verified!</h1>
      <p>Your email has been verified. You can now log in to Vendr.</p>
      <a href="vendr://login" class="btn">Open Vendr App</a>
      <p style="margin-top:16px;margin-bottom:0;font-size:12px;color:#6B5E50;">
        If the app does not open, make sure Vendr is installed on your device.
      </p>
    </div>
    <div id="state-error" class="hidden">
      <div class="icon">❌</div>
      <h1>Verification Failed</h1>
      <p id="error-message">This link is invalid or has expired.</p>
      <a href="vendr://login" class="btn">Back to App</a>
    </div>
  </div>
  <script>
    const API = 'https://vendr-backend-unlt.onrender.com/api'
    function show(id) {
      ['state-loading','state-success','state-error'].forEach(s =>
        document.getElementById(s).classList.add('hidden'))
      document.getElementById(id).classList.remove('hidden')
    }
    async function verify() {
      const token = new URLSearchParams(window.location.search).get('token')
      if (!token) {
        document.getElementById('error-message').textContent = 'No token found in this link.'
        return show('state-error')
      }
      try {
        const res = await fetch(`${API}/auth/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        })
        if (res.ok) return show('state-success')
        const data = await res.json()
        document.getElementById('error-message').textContent = data.message || 'Verification failed.'
        show('state-error')
      } catch {
        document.getElementById('error-message').textContent = 'Network error. Please try again.'
        show('state-error')
      }
    }
    verify()
  </script>
</body>
</html>
